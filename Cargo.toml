[package]
name = "compose"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
directories = "6.0"
nix = { version = "0.31", features = ["user"] }
once_cell = "1.20"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
url = "2.5"
which = "8.0.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
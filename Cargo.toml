[package]
name = "compose"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "composectl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
directories = "6.0"
nix = { version = "0.31", features = ["user"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
toml = "1.1"
url = "2.5"
which = "8.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
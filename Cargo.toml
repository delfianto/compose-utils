[package]
name = "compose"
version = "0.3.1"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[[bin]]
name = "composectl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
nix = { version = "0.32", features = ["user"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.2"
url = "2.5"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "z"
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

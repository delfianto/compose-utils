[package]
name = "compose"
version = "0.1.0"
edition = "2024"

[dependencies]
url = "2.5"
anyhow = "1.0"
regex = "1.12"
serde_json = "1.0"
directories = "6.0"
nix = { version = "0.31", features = ["user"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

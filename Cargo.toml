[package]
name = "compose"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-recursion = "1.1"
async-trait = "0.1"
bollard = "0.20.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
directories = "6.0"
futures-util = "0.3"
nix = { version = "0.31", features = ["user"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
systemd = { version = "0.10", default-features = false, features = ["journal"] }
tempfile = "3"
url = "2.5"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "compose"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
directories = "5.0"
clap = { version = "4.4", features = ["derive"] }
nix = { version = "0.27", features = ["user"] }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
